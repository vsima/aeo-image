name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  zero-deps:
    runs-on: ubuntu-latest
    name: zero runtime dependencies
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: node scripts/check-zero-deps.mjs

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22.x, 24.x]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run typecheck
      - run: npm test # runs .ts directly via native type stripping (Node 22+)

  node20-compat:
    runs-on: ubuntu-latest
    name: node20 build + smoke (lowest supported runtime)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - run: npm install
      - run: npm run build # explicit: no install-time build since v1.0.1
      - name: Import the built package and round-trip on Node 20
        run: |
          node --input-type=module -e "
          import { writeMetadata, readMetadata } from './dist/index.js';
          import { readFileSync } from 'node:fs';
          const b = new Uint8Array(readFileSync('test/fixtures/simple.webp'));
          const o = writeMetadata(b, { description: 'node20 ok', keywords: ['x'] });
          const r = readMetadata(o);
          if (r.description !== 'node20 ok') { console.error('FAIL', r); process.exit(1); }
          console.log('node20 round-trip OK');
          "

  interop:
    runs-on: ubuntu-latest
    name: external-tool interop (exiftool)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm install
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - name: WebP — write metadata, verify exiftool reads it back
        run: |
          node examples/01-read-write.mjs
          exiftool examples/out.webp
          exiftool examples/out.webp | grep -q "Frisbee Dog" \
            && echo "✅ WebP XMP round-trip verified by exiftool" \
            || (echo "❌ WebP XMP not found by exiftool" && exit 1)
      - name: AVIF — write metadata, verify exiftool reads it back
        run: |
          node examples/05-avif.mjs
          exiftool examples/out.avif
          exiftool examples/out.avif | grep -q "Rice Terraces" \
            && echo "✅ AVIF XMP round-trip verified by exiftool" \
            || (echo "❌ AVIF XMP not found by exiftool" && exit 1)
      - name: JPEG & PNG — write metadata, verify exiftool reads it back
        run: |
          node --input-type=module -e "
          import { writeMetadata } from './src/index.ts';
          import { readFileSync, writeFileSync } from 'node:fs';
          for (const fmt of ['jpg', 'png']) {
            const b = new Uint8Array(readFileSync('test/fixtures/sample.' + fmt));
            const out = writeMetadata(b, { description: 'CI interop ' + fmt, keywords: ['ci'] });
            writeFileSync('interop.' + fmt, out);
          }
          "
          for fmt in jpg png; do
            exiftool interop.$fmt | grep -q "CI interop $fmt" \
              && echo "✅ $fmt XMP round-trip verified by exiftool" \
              || (echo "❌ $fmt XMP not found by exiftool" && exit 1)
          done
      - name: HEIC — write metadata, verify exiftool reads it back
        run: |
          node --input-type=module -e "
          import { writeMetadata } from './src/index.ts';
          import { readFileSync, writeFileSync } from 'node:fs';
          const b = new Uint8Array(readFileSync('test/fixtures/sample.heic'));
          writeFileSync('interop.heic', writeMetadata(b, { description: 'CI interop heic', keywords: ['ci'] }));
          "
          exiftool interop.heic | grep -q "CI interop heic" \
            && echo "✅ HEIC XMP round-trip verified by exiftool" \
            || (echo "❌ HEIC XMP not found by exiftool" && exit 1)
      - name: IPTC 2025.1 AI provenance — verify exiftool reads the new tags
        run: |
          node --input-type=module -e "
          import { writeMetadata, DIGITAL_SOURCE_TYPE } from './src/index.ts';
          import { readFileSync, writeFileSync } from 'node:fs';
          const b = new Uint8Array(readFileSync('test/fixtures/sample.jpg'));
          const out = writeMetadata(b, {
            digitalSourceType: DIGITAL_SOURCE_TYPE.trainedAlgorithmicMedia,
            ai: {
              prompt: 'CI neon market prompt',
              promptWriter: 'CI Prompt Writer',
              system: 'CI Diffusion',
              systemVersion: '9.9',
            },
          });
          writeFileSync('interop-ai.jpg', out);
          "
          # exiftool >= 13.40 knows the 2025.1 AI tags by name; older versions
          # (e.g. Ubuntu's packaged build) still surface them via -u as unknown
          # XMP properties. -u keeps this green either way; values prove it.
          exiftool -ver
          exiftool -u -G1 interop-ai.jpg
          for needle in "CI neon market prompt" "CI Prompt Writer" "CI Diffusion" "trainedAlgorithmicMedia"; do
            exiftool -u interop-ai.jpg | grep -q "$needle" \
              && echo "✅ exiftool reads: $needle" \
              || (echo "❌ exiftool missing: $needle" && exit 1)
          done
